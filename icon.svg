<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 語彙とれ：実況ノートのアイコン（黒地・三角格子・右上の赤い角）を元に、再生ボタンを「赤い吹き出し」に変えたもの -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262c"/><stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d50"/><stop offset="1" stop-color="#b3191c"/>
    </linearGradient>
    <clipPath id="r"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
      <path d="M-20 64 L28 -20 L76 64 L124 -20 L172 64 L220 -20 L268 64 M-20 64 L28 148 L76 64 L124 148 L172 64 L220 148 L268 64 M-20 148 L28 232 L76 148 L124 232 L172 148 L220 232 L268 148 M-20 232 L28 316 L76 232 L124 316 L172 232 L220 316 L268 232"/>
    </g>
    <path d="M196 0 H256 V60 Z" fill="#e5383b" opacity="0.85"/>
  </g>
  <!-- 吹き出し（話す言葉） -->
  <path d="M60 70 Q60 52 78 52 H178 Q196 52 196 70 V146 Q196 164 178 164 H118 L82 196 L88 164 H78 Q60 164 60 146 Z" fill="url(#red)"/>
  <!-- 言葉の線（増えていく語彙） -->
  <g stroke="#ececf1" stroke-width="10" stroke-linecap="round">
    <line x1="88" y1="88" x2="168" y2="88"/>
    <line x1="88" y1="110" x2="150" y2="110" stroke-opacity="0.85"/>
    <line x1="88" y1="132" x2="124" y2="132" stroke-opacity="0.7"/>
  </g>
  <!-- 右下の小さなひらめき（ひし形） -->
  <path d="M200 176 L210 194 L228 204 L210 214 L200 232 L190 214 L172 204 L190 194 Z" fill="#ffc94d"/>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#3a3a44" stroke-width="3"/>
</svg>
